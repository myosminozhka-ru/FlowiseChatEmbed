  NOTE: This .html file (and public folder) is optional and can be safely deleted.
  It serves only as a demo/test page.
  
  The chatbot can be embedded directly on any allowed domain using the embed script that
  is generated when starting the server.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OsmiAI Chatbot Widget</title>
</head>

<body>
    <div id="root"></div>
    <script type="module">
        (async () => {
            try {
                // Загружаем конфигурацию с сервера
                const baseUrl = window.location.origin;
                const configResponse = await fetch(`${baseUrl}/api/config`);
                if (!configResponse.ok) {
                    throw new Error('Не удалось загрузить конфигурацию');
                }
                const config = await configResponse.json();

                // Загружаем модуль чатбота
                let module;
                try {
                    module = await import(`${baseUrl}/web.js`);
                } catch (e1) {
                    try {
                        module = await import('./web.js');
                    } catch (e2) {
                        module = await import('/web.js');
                    }
                }

                // Получаем Chatbot из модуля или window
                let Chatbot = module.default;
                if (window.Chatbot) {
                    Chatbot = window.Chatbot;
                }

                if (!Chatbot || typeof Chatbot.init !== 'function') {
                    throw new Error('Chatbot.init не доступен');
                }

                // Инициализируем чатбот с конфигурацией из .env
                Chatbot.init({
                    chatflowid: config.chatflowid,
                    apiHost: config.apiHost,
                    autofaqConfig: config.autofaqConfig,
                });
            } catch (error) {
                console.error('❌ Ошибка загрузки чатбота:', error);
            }
        })();
    </script>
</body>

</html>
