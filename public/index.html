  NOTE: This .html file (and public folder) is optional and can be safely deleted.
  It serves only as a demo/test page.

  The chatbot can be embedded directly on any allowed domain using the embed script that
  is generated when starting the server.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Widget</title>
</head>

<body>
    <div id="root"></div>
    <script type="module">
        (async () => {
            try {
                // Загружаем модуль чатбота
                let module;
                try {
                    module = await import('./web.js');
                } catch (e1) {
                    try {
                        module = await import('/web.js');
                    } catch (e2) {
                        module = await import('/dist/web.js');
                    }
                }

                // Получаем Chatbot из модуля или window
                let Chatbot = module.default;
                if (window.Chatbot) {
                    Chatbot = window.Chatbot;
                }

                if (!Chatbot || typeof Chatbot.init !== 'function') {
                    throw new Error('Chatbot.init не доступен');
                }

                // Конфигурация из переменных окружения
                const config = {};

                // Инициализируем чатбот с параметрами из конфигурации
                Chatbot.init({
                    chatflowid: config.chatflowId,
                    apiHost: config.apiHost,
                    apiKey: undefined,
                    theme: {
                        chatWindow: {
                            welcomeTitle: config.welcomeTitle,
                            welcomeText: config.welcomeText
                        }
                    }
                });
            } catch (error) {
                console.error('❌ Ошибка загрузки чатбота:', error);
            }
        })();
    </script>
</body>

</html>
