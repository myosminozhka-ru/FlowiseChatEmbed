<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Полноэкранный чат</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }

        start-ai-fullchatbot {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>

<body>
    <!-- Элемент для полноэкранного чата -->
    <start-ai-fullchatbot></start-ai-fullchatbot>

    <script type="module">
        (async () => {
            try {
                // Загружаем модуль чатбота
                const baseUrl = window.location.origin;
                let module;

                try {
                    module = await import(`${baseUrl}/web.js`);
                } catch (e1) {
                    try {
                        module = await import('./web.js');
                    } catch (e2) {
                        module = await import('/web.js');
                    }
                }

                // Получаем Chatbot из модуля или window
                let Chatbot = module.default;
                if (window.Chatbot) {
                    Chatbot = window.Chatbot;
                }

                if (!Chatbot || typeof Chatbot.initFull !== 'function') {
                    throw new Error('Chatbot.initFull не доступен');
                }

                // Инициализируем полноэкранный чат
                Chatbot.initFull({
                    chatflowid: '416feeac-4a95-4f6e-a81d-73f8f48bc54f',
                    apiHost: 'https://app.osmi-it.ru',
                    chatflowConfig: {
                        chatFeedback: {
                            status: true
                        }
                    },
                    theme: {
                        chatWindow: {
                            showTitle: true,
                            title: 'Умный помщник',
                            // Не указываем height и width для полноэкранного режима
                            botMessage: {
                                showAvatar: true,
                            },
                            dateTimeToggle: {
                                date: false,
                                time: true
                            },
                        },
                    }
                });

                console.log('✅ Полноэкранный чат инициализирован');
            } catch (error) {
                console.error('❌ Ошибка загрузки чатбота:', error);
                document.body.innerHTML = `
                    <div style="padding: 20px; color: red; font-family: Arial, sans-serif;">
                        <h2>Ошибка загрузки чатбота</h2>
                        <p>${error.message}</p>
                        <p>Проверьте консоль браузера (F12) для подробностей.</p>
                    </div>
                `;
            }
        })();
    </script>
</body>

</html>
